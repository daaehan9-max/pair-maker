<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>페어틀 편집기</title>
    <style>
        /* 전체 컨테이너 (기준점 설정) */
        .pair-container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 2px solid #ccc;
            overflow: hidden;
            background-color: #f9f9f9;
            margin-bottom: 20px;
        }

        /* 사진 영역 (z-index를 낮게 설정하여 뒤로 배치) */
        .photo-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* 뒤쪽 레이어 */
        }

        .photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 말풍선/프레임 영역 (z-index를 높게 설정하여 앞으로 배치) */
        .overlay-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* 앞쪽 레이어 (말풍선이 사진 위를 덮음) */
            pointer-events: none; /* 마우스 클릭이 뒤의 사진이나 버튼에 닿도록 설정 */
            display: flex;
            align-items: flex-end;
            padding: 20px;
            box-sizing: border-box;
        }

        .speech-bubble {
            background: white;
            border: 2px solid #333;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            pointer-events: auto; /* 말풍선 내부 상호작용 필요시 */
        }
    </style>
</head>
<body>

    <!-- 페어틀 미리보기 영역 -->
    <div class="pair-container">
        <!-- 사진이 들어가는 영역 (뒤쪽) -->
        <div class="photo-area">
            <!-- 기본값 사진 (업로드 시 숨겨짐) -->
            <img id="default-photo" src="https://via.placeholder.com/400?text=Default+Photo" alt="기본 사진">
            <!-- 사용자가 업로드한 사진 (처인엔 숨김) -->
            <img id="user-photo" src="" alt="업로드된 사진" style="display: none;">
        </div>

        <!-- 말풍선 및 프레임 영역 (앞쪽) -->
        <div class="overlay-frame">
            <div class="speech-bubble">
                여기에 대화 내용이 들어갑니다! (말풍선 뒤로 사진이 배치됩니다)
            </div>
        </div>
    </div>

    <!-- 파일 업로드 입력창 -->
    <input type="file" id="image-upload" accept="image/*">

    <script>
        const imageUpload = document.getElementById('image-upload');
        const userPhoto = document.getElementById('user-photo');
        const defaultPhoto = document.getElementById('default-photo');

        imageUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // 1. 사용자가 넣은 사진으로 src 변경 후 표시
                    userPhoto.src = e.target.result;
                    userPhoto.style.display = 'block';
                    
                    // 2. 기본값 사진 숨기기
                    if (defaultPhoto) {
                        defaultPhoto.style.display = 'none';
                    }
                }
                reader.readAsDataURL(file);
            }
        });
    </script>

</body>
</html>
