*{box-sizing:border-box}body{margin:0;background:#f0f0f0;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.app{display:flex;flex-direction:column;min-height:100vh}.controls{background:white;padding:18px 16px 20px;border-bottom:1px solid #ddd}
h1{font-size:20px;margin:0 0 14px}.section{border-top:1px solid #e7e7e7;padding:12px 0}.section h2{font-size:14px;margin:0 0 10px;color:#333}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.field label{display:block;font-size:12px;color:#555;margin-bottom:5px}
input[type=text],textarea{width:100%;padding:9px 10px;border:1px solid #d4d4d4;border-radius:7px;font:inherit;font-size:13px;background:#fff}
textarea{min-height:68px;resize:vertical}input[type=file]{width:100%;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}button{border:0;border-radius:8px;padding:10px 14px;background:#222;color:#fff;font-size:13px;cursor:pointer}button.secondary{background:#eee;color:#222}
.stage{padding:16px 10px 28px}.stagehead{max-width:1120px;margin:0 auto 10px;font-size:12px;color:#666}

<body><div class="app">
<aside class="controls">
<h1>페어틀 편집기</h1>

<div class="section"><h2>두상</h2><div class="fields">

</div></div>

<script>
const $=id=>document.getElementById(id);
const links=[['inNameA','nameA'],['inNameB','nameB'],['inEnA','enA'],['inEnB','enB'],['inThoughtA','thoughtA'],['inThoughtB','thoughtB'],['inTraitsA','traitsA'],['inTraitsB','traitsB']];
links.forEach(([input,out])=>$(input).addEventListener('input',()=>$(out).textContent=$(input).value));
function attach(fileId,imgId){$(fileId).addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=$(imgId);im.src=r.result;im.style.display='block'};r.readAsDataURL(f)})}
[['fileHeadA','headA'],['fileHeadB','headB'],['fileTokenA','tokenA'],['fileTokenB','tokenB'],['fileCenter','centerImage'],['fileMoeA','moeA'],['fileMoeB','moeB']].forEach(x=>attach(...x));
$('pdf').onclick=()=>window.print();$('reset').onclick=()=>location.reload();
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$('svg').onclick=()=>{const clone=$('preview').cloneNode(true);const styles=[...document.styleSheets].map(s=>{try{return [...s.cssRules].map(r=>r.cssText).join('')}catch(e){return ''}}).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="928"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>${styles}</style>${clone.outerHTML}</div></foreignObject></svg>`;download(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),'pair-template.svg')};
$('png').onclick=async()=>{try{if(!window.html2canvas)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});const c=await html2canvas($('preview'),{scale:2,backgroundColor:null,useCORS:true});c.toBlob(b=>download(b,'pair-template.png'))}catch(e){alert('PNG 저장에 실패했어요. 인터넷 연결 후 다시 시도하거나 인쇄/PDF 저장을 이용해 주세요.')}};
</script></body></html>
